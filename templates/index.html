<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Griffiths Tutor</title>

<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e4e6eb;
    --muted: #8b8f9a;
    --accent: #6ea8fe;
    --user-bubble: #23324a;
    --assistant-bubble: #1c1f27;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overscroll-behavior-y: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;   /* fallback for older browsers */
    height: 100dvh;  /* actual visible viewport; JS also manages this for keyboard */
    max-width: 820px;
    margin: 0 auto;
  }
  header {
    padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 12px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  header p {
    margin: 4px 0 0;
    font-size: 12.5px;
    color: var(--muted);
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    scroll-behavior: smooth;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 92%;
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.5;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-x: auto;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border: 1px solid #2f4468;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--assistant-bubble);
    border: 1px solid var(--border);
  }
  .msg.system-note {
    align-self: center;
    color: var(--muted);
    font-size: 12.5px;
    font-style: italic;
  }
  #inputbar {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border);
  }
  #inputbar textarea {
    flex: 1;
    resize: none;
    min-height: 44px;
    max-height: 160px;
    padding: 11px 13px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 16px; /* 16px+ stops iOS Safari auto-zooming on focus */
    font-family: inherit;
    touch-action: manipulation;
  }
  #inputbar textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  #inputbar button {
    padding: 0 18px;
    min-width: 44px;
    min-height: 44px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #0f1115;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #inputbar button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .hint {
    padding: 0 16px 8px;
    font-size: 12px;
    color: var(--muted);
  }
  @media (max-width: 480px) {
    header { padding-left: 16px; padding-right: 16px; }
    header p { display: none; } /* save vertical space on small screens */
  }
  .hint code {
    background: var(--panel);
    padding: 1px 5px;
    border-radius: 4px;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Griffiths Tutor</h1>
    <p>Method selection &amp; physical interpretation coach — it won't solve it for you.</p>
  </header>

  <div id="messages"></div>
  <div class="hint">Paste an unsolved problem, or a final expression + <code>/interpret</code>. Type <code>/method</code> or <code>/interpret</code> to force a mode.</div>

  <div id="inputbar">
    <textarea id="input" placeholder="Paste a problem or ask a question…" rows="1"></textarea>
    <button id="send">Send</button>
  </div>
</div>

<script>
const appEl = document.getElementById('app');
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');

let history = []; // {role, content}

// Keep the app's height matched to the actual visible viewport. On mobile,
// 100dvh alone doesn't reliably account for the on-screen keyboard in every
// browser, so this keeps the input bar visible above it rather than covered.
function syncViewportHeight() {
  const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  appEl.style.height = vh + 'px';
}
syncViewportHeight();
window.addEventListener('resize', syncViewportHeight);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', syncViewportHeight);
}

// When the keyboard opens (input focused), scroll the latest message back
// into view once the layout has settled.
inputEl.addEventListener('focus', () => {
  setTimeout(() => { messagesEl.scrollTop = messagesEl.scrollHeight; }, 300);
});

function renderMath(el) {
  if (window.renderMathInElement) {
    renderMathInElement(el, {
      delimiters: [
        {left: "\\[", right: "\\]", display: true},
        {left: "\\(", right: "\\)", display: false}
      ],
      throwOnError: false
    });
  }
}

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = content;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function autosize() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
}
inputEl.addEventListener('input', autosize);

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  inputEl.value = '';
  autosize();
  sendBtn.disabled = true;

  addMessage('user', text);
  history.push({role: 'user', content: text});

  const assistantDiv = addMessage('assistant', '');
  let assistantText = '';

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({messages: history})
    });

    if (!resp.ok || !resp.body) {
      assistantDiv.textContent = '[Error: request failed]';
      sendBtn.disabled = false;
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      assistantText += decoder.decode(value, {stream: true});
      assistantDiv.textContent = assistantText;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    renderMath(assistantDiv);
    history.push({role: 'assistant', content: assistantText});
  } catch (err) {
    assistantDiv.textContent = '[Error: ' + err.message + ']';
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

inputEl.focus();
</script>
</body>
</html>
